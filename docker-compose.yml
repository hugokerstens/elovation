services:
  db:
    ports:
      - 5432:5432
    image: postgres:18
    volumes:
      - ./tmp/db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: password
  web:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && RAILS_ENV=development bundle exec rails db:prepare && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/elovation
    ports:
      - "4321:3000"
    depends_on:
      - db
